<!DOCTYPE html>
<html lang="en">

<head>



    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/images/logo.png">
    <title>Profile | Vignan Student Portal</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .profile-photo-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 16px;
        }

        .profile-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-primary);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .profile-photo-placeholder {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
        }

        .photo-upload-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 32px;
            height: 32px;
            background: var(--accent-primary);
            border: 2px solid #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.8rem;
            color: #fff;
            transition: transform 0.2s;
        }

        .photo-upload-btn:hover {
            transform: scale(1.1);
        }

        .profile-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 30px 24px;
            text-align: center;
            box-shadow: var(--shadow-glow);
            margin-bottom: 20px;
        }

        .profile-name {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 8px 0 4px;
        }

        .profile-roll {
            color: var(--accent-primary);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .profile-dept {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .edit-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 24px;
            box-shadow: var(--shadow-glow);
            margin-bottom: 20px;
        }

        .edit-section h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .profile-info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            font-size: 0.9rem;
        }

        .profile-info-row:last-child {
            border-bottom: none;
        }

        .profile-info-label {
            color: var(--text-secondary);
        }

        .profile-info-value {
            color: var(--text-primary);
            font-weight: 600;
        }

        .admin-badge {
            display: inline-block;
            padding: 3px 10px;
            background: linear-gradient(135deg, #f59e0b, #f97316);
            color: #fff;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 8px;
        }
    </style>
    <script src="/js/version-check.js"></script>
</head>

<body>
    <div class="bg-animation">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>
    <div class="container">
        <div class="dash-header">
            <div style="display:flex;align-items:center;gap:12px;">
                <img src="/images/logo.png" alt="Vignan Logo"
                    style="width:40px;height:40px;border-radius:50%;object-fit:contain;">
                <div>
                    <div class="greeting">My Profile</div>
                    <div class="student-name" id="headerName">Student</div>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn" title="Logout">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
            </button>
        </div>

        <!-- Navigation -->
        <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;">
            <a href="/dashboard"
                style="flex:1;padding:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,0,0,0.06);color:var(--text-secondary);border-radius:10px;text-align:center;text-decoration:none;font-weight:600;font-size:0.8rem;">📊
                Attendance</a>
            <a href="/results"
                style="flex:1;padding:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,0,0,0.06);color:var(--text-secondary);border-radius:10px;text-align:center;text-decoration:none;font-weight:600;font-size:0.8rem;">📝
                Results</a>
            <a href="/announcements"
                style="flex:1;padding:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,0,0,0.06);color:var(--text-secondary);border-radius:10px;text-align:center;text-decoration:none;font-weight:600;font-size:0.8rem;">📢
                Updates</a>
            <a href="/profile"
                style="flex:1;padding:10px;background:var(--gradient-primary);color:#fff;border-radius:10px;text-align:center;text-decoration:none;font-weight:600;font-size:0.8rem;">👤
                Profile</a>
        </div>

        <!-- Profile Card -->
        <div class="profile-card" id="profileCard">
            <div class="profile-photo-wrapper">
                <div class="profile-photo-placeholder" id="photoContainer">V</div>
                <label class="photo-upload-btn" for="photoInput" title="Change Photo">📷</label>
                <input type="file" id="photoInput" accept="image/*" style="display:none;">
            </div>
            <div class="profile-name" id="profileName">Student<span class="admin-badge" id="adminBadge"
                    style="display:none;">Admin</span></div>
            <div class="profile-roll" id="profileRoll">—</div>
            <div class="profile-dept" id="profileDept">—</div>
        </div>

        <!-- Edit Section -->
        <div class="edit-section">
            <h3>✏️ Edit Profile</h3>
            <div id="editAlert" class="alert"></div>
            <div class="form-group">
                <label for="editName">Full Name</label>
                <input type="text" id="editName" placeholder="Your name">
            </div>
            <button class="btn btn-primary" id="saveNameBtn" style="margin-top:8px;">
                <span class="btn-text">Save Changes</span>
                <span class="spinner"></span>
            </button>
        </div>

        <!-- Info Section -->
        <div class="edit-section">
            <h3>📋 Account Info</h3>
            <div class="profile-info-row"><span class="profile-info-label">Email</span><span class="profile-info-value"
                    id="infoEmail">—</span></div>
            <div class="profile-info-row"><span class="profile-info-label">Department</span><span
                    class="profile-info-value" id="infoDept">—</span></div>
            <div class="profile-info-row"><span class="profile-info-label">Year</span><span class="profile-info-value"
                    id="infoYear">—</span></div>
            <div class="profile-info-row"><span class="profile-info-label">Section</span><span
                    class="profile-info-value" id="infoSection">—</span></div>
            <div class="profile-info-row"><span class="profile-info-label">Joined</span><span class="profile-info-value"
                    id="infoJoined">—</span></div>
        </div>
        <div class="bottom-spacer"></div>
    </div>
    <script src="/js/profile.js"></script>
  


</body>

</html>
