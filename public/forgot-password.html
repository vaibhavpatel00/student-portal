<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Reset your password - Vignan Student Portal">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/images/logo.png">
    <title>Forgot Password | Vignan Student Portal</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="bg-animation">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon"><img src="/images/logo.png" alt="Vignan Logo"></div>
                <h1>Forgot Password</h1>
                <p>Enter your registered email to receive a reset link</p>
            </div>

            <div id="alert" class="alert"></div>

            <form id="forgotForm" autocomplete="off">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
                </div>

                <button type="submit" class="btn btn-primary" id="forgotBtn">
                    <span class="btn-text">Send Reset Link</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <div class="auth-footer">
                Remember your password? <a href="/">Sign In</a>
            </div>
        </div>
    </div>

    <script src="/js/forgot-password.js"></script>
  <script src="/js/force-update.js"></script>
</body>

</html>
