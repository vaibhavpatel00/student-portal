<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Register for Vignan Student Attendance Portal">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/images/logo.png">
    <title>Register | Vignan Student Portal</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="bg-animation">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon"><img src="/images/logo.png" alt="Vignan Logo"></div>
                <h1>Create Account</h1>
                <p>Register to track your attendance</p>
            </div>

            <div id="alert" class="alert"></div>

            <form id="registerForm" autocomplete="off">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="roll_number">Roll Number</label>
                    <input type="text" id="roll_number" name="roll_number" placeholder="e.g., 24891A0541" required
                        autocapitalize="characters">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="department">Department</label>
                        <select id="department" name="department" required>
                            <option value="">Select</option>
                            <option value="CSE">CSE</option>
                            <option value="ECE">ECE</option>
                            <option value="EEE">EEE</option>
                            <option value="MECH">MECH</option>
                            <option value="CIVIL">CIVIL</option>
                            <option value="IT">IT</option>
                            <option value="CSM">CSM</option>
                            <option value="CSD">CSD</option>
                            <option value="CSC">CSC</option>
                            <option value="AIDS">AIDS</option>
                            <option value="AIML">AIML</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="year">Year</label>
                        <select id="year" name="year" required>
                            <option value="">Select</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="section">Section</label>
                    <select id="section" name="section" required>
                        <option value="">Select</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="E">E</option>
                    </select>
                </div>

                <div class="form-group" style="position: relative;">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Min 6 characters" required
                        minlength="6" style="padding-right: 40px;">
                    <span onclick="togglePassword('password', this)" style="position: absolute; right: 12px; top: 38px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; width: 24px; height: 24px;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </span>
                </div>

                <div class="form-group" style="position: relative;">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password"
                        placeholder="Re-enter your password" required style="padding-right: 40px;">
                    <span onclick="togglePassword('confirm_password', this)" style="position: absolute; right: 12px; top: 38px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; width: 24px; height: 24px;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </span>
                </div>

                <button type="submit" class="btn btn-primary" id="registerBtn">
                    <span class="btn-text">Create Account</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="/">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                iconElement.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"/></svg>';
            } else {
                input.type = 'password';
                iconElement.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
            }
        }
    </script>
    <script src="/js/register.js"></script>
  

<script>
(function() {
    function checkAppVersion() {
        if (!window.Capacitor || !window.Capacitor.isNative) return;
        try {
            var plugins = window.Capacitor.Plugins || {};
            // Old app does not have UnityAds, new app has it (v1.5+)
            var hasNewVersion = typeof plugins.UnityAds !== "undefined";
            
            if (!hasNewVersion) {
                showForceUpdateScreen();
            }
        } catch (err) {
            showForceUpdateScreen();
        }
    }

    function showForceUpdateScreen() {
        if (!document.body) {
            setTimeout(showForceUpdateScreen, 50);
            return;
        }
        if (document.getElementById("force-update-overlay")) return;

        var overlay = document.createElement("div");
        overlay.id = "force-update-overlay";
        overlay.style.cssText = "position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #ffffff; z-index: 999999999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; font-family: -apple-system, BlinkMacSystemFont, sans-serif; box-sizing: border-box;";

        overlay.innerHTML = `<div style="background: rgba(230, 57, 70, 0.1); padding: 24px; border-radius: 50%; margin-bottom: 24px;"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#e63946" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg></div><h2 style="color:#1e293b; margin-top:0; margin-bottom: 12px; font-size: 1.75rem; font-weight: 700;">Update Required</h2><p style="color:#64748b; margin: 0 0 32px; font-size: 1.05rem; max-width: 320px; line-height: 1.6;">A new version of the Vignan Portal is available. You must update your app in the Play Store to continue.</p><a href="https://play.google.com/store/apps/details?id=com.vignanportal.app&hl=en" style="background:#4f46e5; color:#ffffff; text-decoration:none; padding:16px 24px; border-radius:12px; font-weight:600; font-size: 1.1rem; width:100%; max-width:280px; display:block; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);">Update App Now</a>`;

        document.body.appendChild(overlay);
        document.body.style.overflow = "hidden";
    }

    setTimeout(checkAppVersion, 300);
})();
</script>
</body>

</html>
