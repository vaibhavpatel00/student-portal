<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Vignan Student Attendance Portal - Track your attendance in real-time">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/images/logo.png">
  <title>Login | Vignan Student Portal</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <button id="showAdButton"
    style="position: fixed; top: 10px; left: 10px; z-index: 9999; padding: 10px; background: red; color: white;">TEST
    AD</button>
  <div class="bg-animation">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon"><img src="/images/logo.png" alt="Vignan Logo"></div>
        <h1>Vignan Portal</h1>
        <p>Track your attendance in real-time</p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="roll_number">Roll Number or Email</label>
          <input type="text" id="roll_number" name="roll_number" placeholder="Enter roll number or email" required>
        </div>

        <div class="form-group" style="position: relative;">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required style="padding-right: 40px;">
          <span onclick="togglePassword('password', this)" style="position: absolute; right: 12px; top: 38px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; width: 24px; height: 24px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </span>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">
          <span class="btn-text">Sign In</span>
          <span class="spinner"></span>
        </button>
      </form>

      <div class="auth-footer" style="margin-top:12px;">
        <a href="/forgot-password" style="font-size:0.85rem;">Forgot Password?</a>
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Register here</a>
      </div>

      <div class="auth-footer" style="opacity: 0.7; font-size: 0.75rem; margin-top: 15px;">
        By signing in, you agree to our <a href="privacy.html">Privacy Policy</a>
      </div>
    </div>
  </div>

  <script>
    function togglePassword(inputId, iconElement) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        iconElement.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"/></svg>';
      } else {
        input.type = 'password';
        iconElement.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      }
    }
  </script>
  <script src="/js/login.js"></script>

  <!-- AdMob Banner -->
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      // Check if running natively and AdMob is available via Capacitor
      if (window.Capacitor && window.Capacitor.isNative) {
        const { AdMob } = window.Capacitor.Plugins;
        if (AdMob) {
          try {
            await AdMob.initialize();
            await AdMob.showBanner({
              adId: 'ca-app-pub-8014232754853322/3736068867',
              adSize: 'BANNER',
              position: 'BOTTOM_CENTER'
            });
          } catch (err) {
            console.log("AdMob error:", err);
          }
        }
      }
    });
  </script>

</body>

</html>
