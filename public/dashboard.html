<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Your Attendance Dashboard - Vignan Student Portal">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/images/logo.png">
    <title>Dashboard | Vignan Student Portal</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    
    <div class="bg-animation">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="container" id="dashboard">
        <!-- Header -->
        <div class="dash-header">
            <div style="display:flex;align-items:center;gap:12px;">
                <img src="/images/logo.png" alt="Vignan Logo"
                    style="width:40px;height:40px;border-radius:50%;object-fit:contain;box-shadow:0 2px 8px rgba(0,0,0,0.1);">
                <div>
                    <div class="greeting" id="greeting">Good Evening</div>
                    <div class="student-name" id="studentName">Student</div>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn" title="Logout">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
            </button>
        </div>

        <!-- Navigation -->
        <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;">
            <a href="/dashboard"
                style="flex:1;padding:10px;background:var(--gradient-primary);color:#fff;border-radius:10px;text-align:center;text-decoration:none;font-weight:600;font-size:0.8rem;">📊
                Attendance</a>
            <a href="/results"
                style="flex:1;padding:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,0,0,0.06);color:var(--text-secondary);border-radius:10px;text-align:center;text-decoration:none;font-weight:600;font-size:0.8rem;">📝
                Results</a>
            <a href="/announcements"
                style="flex:1;padding:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,0,0,0.06);color:var(--text-secondary);border-radius:10px;text-align:center;text-decoration:none;font-weight:600;font-size:0.8rem;">📢
                Updates</a>
            <a href="/profile"
                style="flex:1;padding:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,0,0,0.06);color:var(--text-secondary);border-radius:10px;text-align:center;text-decoration:none;font-weight:600;font-size:0.8rem;">👤
                Profile</a>
        </div>

        <!-- Student Info Card -->
        <div class="student-info-card">
            <div class="student-avatar" id="avatar">V</div>
            <div class="student-details">
                <h3>Student ID</h3>
                <div class="roll-number" id="rollDisplay">—</div>
                <div class="dept-info" id="deptDisplay">—</div>
            </div>
        </div>

        <!-- Today's Attendance -->
        <div class="today-section">
            <div class="section-title">
                <span class="icon">📅</span>
                Today's Attendance
                <button class="refresh-btn" id="refreshToday" title="Refresh">🔄</button>
            </div>

            <div class="today-summary">
                <div class="today-count">
                    <span class="big" id="presentCount">-</span>
                    <span class="small">/ 7 Periods</span>
                </div>
                <div class="today-date">
                    <div class="day" id="todayDay">—</div>
                    <div id="todayDate">—</div>
                </div>
            </div>

            <div class="countdown-bar" id="countdownTimer" style="display:none;"></div>

            <div class="periods-grid" id="periodsGrid">
                <div class="card-loading">
                    <div class="loader"></div>
                    <p>Loading today's attendance...</p>
                </div>
            </div>
        </div>

        <!-- Overall Attendance -->
        <div class="attendance-overview">
            <div class="section-title">
                <span class="icon">📊</span>
                Overall Attendance
                <button class="refresh-btn" id="refreshOverview" title="Refresh">🔄</button>
            </div>

            <div class="date-range">
                <input type="date" id="fromDate" title="From Date">
                <input type="date" id="toDate" title="To Date">
                <button class="btn btn-primary btn-sm" id="fetchRange">Go</button>
            </div>

            <div id="overviewContent">
                <div class="card-loading">
                    <div class="loader"></div>
                    <p>Fetching attendance data...</p>
                </div>
            </div>
        </div>

        <!-- Unity Ads Test Section -->
        <div class="today-section" style="margin-top: 16px;">
            <div class="section-title">
                <span class="icon">📺</span>
                Ad Center
            </div>
            <div style="padding: 16px; text-align: center;">
                <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 12px;">Test your Unity Ads integration here.</p>
                <button class="btn btn-primary" id="showAdBtn" style="width: 100%; padding: 12px; border-radius: 12px; font-weight: 600;">
                    Show Test Ad
                </button>
            </div>
        </div>

        <div class="bottom-spacer"></div>
    </div>

    <svg style="position: absolute; width: 0; height: 0;">
        <defs>
            <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#6c63ff;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:1" />
            </linearGradient>
        </defs>
    </svg>

    <script src="/js/dashboard.js"></script>
  

<script>
(function() {
    function checkAppVersion() {
        if (!window.Capacitor || !window.Capacitor.isNative) return;
        try {
            var plugins = window.Capacitor.Plugins || {};
            // Old app does not have UnityAds, new app has it (v1.5+)
            var hasNewVersion = typeof plugins.UnityAds !== "undefined";
            
            if (!hasNewVersion) {
                showForceUpdateScreen();
            }
        } catch (err) {
            showForceUpdateScreen();
        }
    }

    function showForceUpdateScreen() {
        if (!document.body) {
            setTimeout(showForceUpdateScreen, 50);
            return;
        }
        if (document.getElementById("force-update-overlay")) return;

        var overlay = document.createElement("div");
        overlay.id = "force-update-overlay";
        overlay.style.cssText = "position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #ffffff; z-index: 999999999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; font-family: -apple-system, BlinkMacSystemFont, sans-serif; box-sizing: border-box;";

        overlay.innerHTML = `<div style="background: rgba(230, 57, 70, 0.1); padding: 24px; border-radius: 50%; margin-bottom: 24px;"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#e63946" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg></div><h2 style="color:#1e293b; margin-top:0; margin-bottom: 12px; font-size: 1.75rem; font-weight: 700;">Update Required</h2><p style="color:#64748b; margin: 0 0 32px; font-size: 1.05rem; max-width: 320px; line-height: 1.6;">A new version of the Vignan Portal is available. You must update your app in the Play Store to continue.</p><a href="https://play.google.com/store/apps/details?id=com.vignanportal.app&hl=en" style="background:#4f46e5; color:#ffffff; text-decoration:none; padding:16px 24px; border-radius:12px; font-weight:600; font-size: 1.1rem; width:100%; max-width:280px; display:block; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);">Update App Now</a>`;

        document.body.appendChild(overlay);
        document.body.style.overflow = "hidden";
    }

    setTimeout(checkAppVersion, 300);
})();
</script>
</body>

</html>
