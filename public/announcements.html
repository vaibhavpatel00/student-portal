<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Monetag Multitag -->
    <script src="https://quge5.com/88/tag.min.js" data-zone="229316" async data-cfasync="false"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/images/logo.png">
    <title>Updates | Vignan Student Portal</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 24px;
            box-shadow: var(--shadow-glow);
            margin-bottom: 20px;
        }

        .post-card h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .announcement-item {
            background: var(--bg-secondary);
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 12px;
            animation: slideUp 0.4s ease backwards;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.02);
        }

        .announcement-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .announcement-title .title-text {
            flex: 1;
        }

        .announcement-body {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
            white-space: pre-line;
        }

        .announcement-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--accent-warning);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .attach-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 8px;
            margin-bottom: 8px;
        }

        .attach-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: rgba(99, 102, 241, 0.08);
            border: 1px dashed rgba(99, 102, 241, 0.3);
            border-radius: 8px;
            color: var(--accent-primary);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .attach-btn:hover {
            background: rgba(99, 102, 241, 0.15);
        }

        .attach-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .attach-preview-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 8px;
            font-size: 0.75rem;
        }

        .attach-thumb {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            object-fit: cover;
        }

        .attach-file-icon {
            font-size: 1.2rem;
        }

        .attach-name {
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-secondary);
        }

        .attach-remove {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px;
        }

        .attach-list {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .attach-image-wrap {
            cursor: pointer;
        }

        .attach-image {
            max-width: 100%;
            max-height: 280px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        .attach-download {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            background: rgba(99, 102, 241, 0.06);
            border: 1px solid rgba(99, 102, 241, 0.15);
            border-radius: 8px;
            color: var(--accent-primary);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .attach-download:hover {
            background: rgba(99, 102, 241, 0.12);
        }
    </style>
    <script src="/js/version-check.js"></script>
</head>

<body>
    <div class="bg-animation">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>
    <div class="container">
        <div class="dash-header">
            <div style="display:flex;align-items:center;gap:12px;">
                <img src="/images/logo.png" alt="Vignan Logo"
                    style="width:40px;height:40px;border-radius:50%;object-fit:contain;">
                <div>
                    <div class="greeting">College Updates</div>
                    <div class="student-name" id="headerName">Student</div>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn" title="Logout">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
            </button>
        </div>

        <!-- Navigation -->
        <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;">
            <a href="/dashboard"
                style="flex:1;padding:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,0,0,0.06);color:var(--text-secondary);border-radius:10px;text-align:center;text-decoration:none;font-weight:600;font-size:0.8rem;">📊
                Attendance</a>
            <a href="/results"
                style="flex:1;padding:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,0,0,0.06);color:var(--text-secondary);border-radius:10px;text-align:center;text-decoration:none;font-weight:600;font-size:0.8rem;">📝
                Results</a>
            <a href="/announcements"
                style="flex:1;padding:10px;background:var(--gradient-primary);color:#fff;border-radius:10px;text-align:center;text-decoration:none;font-weight:600;font-size:0.8rem;">📢
                Updates</a>
            <a href="/profile"
                style="flex:1;padding:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,0,0,0.06);color:var(--text-secondary);border-radius:10px;text-align:center;text-decoration:none;font-weight:600;font-size:0.8rem;">👤
                Profile</a>
        </div>

        <!-- Admin Post Section (hidden for non-admins) -->
        <div class="post-card" id="adminPostSection" style="display:none;">
            <h3>📝 Post Announcement</h3>
            <div id="postAlert" class="alert"></div>
            <div class="form-group">
                <label for="postTitle">Title</label>
                <input type="text" id="postTitle" placeholder="Event title or subject">
            </div>
            <div class="form-group">
                <label for="postMessage">Message</label>
                <textarea id="postMessage" placeholder="Write your announcement here..."
                    style="width:100%;min-height:100px;padding:12px 16px;background:var(--bg-glass);border:1px solid var(--border-color);border-radius:var(--radius-md);color:var(--text-primary);font-family:'Inter',sans-serif;font-size:0.95rem;resize:vertical;outline:none;"></textarea>
            </div>
            <button class="btn btn-primary" id="postBtn">
                <span class="btn-text">Post Update</span>
                <span class="spinner"></span>
            </button>
            <div class="attach-bar">
                <label class="attach-btn" for="attachInput">📎 Attach Files</label>
                <input type="file" id="attachInput" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt"
                    style="display:none;">
                <span style="font-size:0.7rem;color:var(--text-muted);">Max 5 files, 5MB each</span>
            </div>
            <div class="attach-preview" id="attachPreview"></div>
        </div>

        <!-- Announcements Feed -->
        <div class="post-card">
            <h3>📢 Latest Updates</h3>
            <div id="announcementsFeed">
                <div class="card-loading">
                    <div class="loader"></div>
                    <p>Loading updates...</p>
                </div>
            </div>
        </div>
        <div class="bottom-spacer"></div>
    </div>
    <script src="/js/announcements.js"></script>
  


</body>

</html>
