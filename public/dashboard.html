<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Your Attendance Dashboard - Vignan Student Portal">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/images/logo.png">
    <title>Dashboard | Vignan Student Portal</title>
    <link rel="stylesheet" href="/css/style.css">

    <!-- Adsterra Popunder -->
    <script type='text/javascript' src='//pl29123335.profitablecpmratenework.com/d2/e0/0c/d2e00cfcde0f8f099c698d65b363abd6.js'></script>
</head>

<body>
    
    <div class="bg-animation">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="container" id="dashboard">
        <!-- Header -->
        <div class="dash-header">
            <div style="display:flex;align-items:center;gap:12px;">
                <img src="/images/logo.png" alt="Vignan Logo"
                    style="width:40px;height:40px;border-radius:50%;object-fit:contain;box-shadow:0 2px 8px rgba(0,0,0,0.1);">
                <div>
                    <div class="greeting" id="greeting">Good Evening</div>
                    <div class="student-name" id="studentName">Student</div>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn" title="Logout">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
            </button>
        </div>

        <!-- Navigation -->
        <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;">
            <a href="/dashboard"
                style="flex:1;padding:10px;background:var(--gradient-primary);color:#fff;border-radius:10px;text-align:center;text-decoration:none;font-weight:600;font-size:0.8rem;">📊
                Attendance</a>
            <a href="/results"
                style="flex:1;padding:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,0,0,0.06);color:var(--text-secondary);border-radius:10px;text-align:center;text-decoration:none;font-weight:600;font-size:0.8rem;">📝
                Results</a>
            <a href="/announcements"
                style="flex:1;padding:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,0,0,0.06);color:var(--text-secondary);border-radius:10px;text-align:center;text-decoration:none;font-weight:600;font-size:0.8rem;">📢
                Updates</a>
            <a href="/profile"
                style="flex:1;padding:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,0,0,0.06);color:var(--text-secondary);border-radius:10px;text-align:center;text-decoration:none;font-weight:600;font-size:0.8rem;">👤
                Profile</a>
        </div>

        <!-- Student Info Card -->
        <div class="student-info-card">
            <div class="student-avatar" id="avatar">V</div>
            <div class="student-details">
                <h3>Student ID</h3>
                <div class="roll-number" id="rollDisplay">—</div>
                <div class="dept-info" id="deptDisplay">—</div>
            </div>
        </div>

        <!-- Today's Attendance -->
        <div class="today-section">
            <div class="section-title">
                <span class="icon">📅</span>
                Today's Attendance
                <button class="refresh-btn" id="refreshToday" title="Refresh">🔄</button>
            </div>

            <div class="today-summary">
                <div class="today-count">
                    <span class="big" id="presentCount">-</span>
                    <span class="small">/ 7 Periods</span>
                </div>
                <div class="today-date">
                    <div class="day" id="todayDay">—</div>
                    <div id="todayDate">—</div>
                </div>
            </div>

            <div class="countdown-bar" id="countdownTimer" style="display:none;"></div>

            <div class="periods-grid" id="periodsGrid">
                <div class="card-loading">
                    <div class="loader"></div>
                    <p>Loading today's attendance...</p>
                </div>
            </div>
        </div>

        <!-- Overall Attendance -->
        <div class="attendance-overview">
            <div class="section-title">
                <span class="icon">📊</span>
                Overall Attendance
                <button class="refresh-btn" id="refreshOverview" title="Refresh">🔄</button>
            </div>

            <div class="date-range">
                <input type="date" id="fromDate" title="From Date">
                <input type="date" id="toDate" title="To Date">
                <button class="btn btn-primary btn-sm" id="fetchRange">Go</button>
            </div>

            <div id="overviewContent">
                <div class="card-loading">
                    <div class="loader"></div>
                    <p>Fetching attendance data...</p>
                </div>
            </div>
        </div>

        <!-- Adsterra Web Ads Section -->
        <div class="today-section" style="margin-top: 16px;">
            <div class="section-title">
                <span class="icon">📺</span>
                Advertisements
            </div>
            <div style="padding: 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px; overflow-x: auto;">
                
                <!-- Native Banner -->
                <div style="width: 100%; min-height: 100px;">
                    <script async="async" data-cfasync="false" src="//pl29123334.profitablecpmratenework.com/05c6b1813ac83fda78c6ff084a947b08/invoke.js"></script>
                    <div id="container-05c6b1813ac83fda78c6ff084a947b08"></div>
                </div>

                <!-- 160x300 Banner -->
                <div style="min-height: 300px;">
                    <script type="text/javascript">
                        atOptions = {
                            'key' : '33d68c3b8aa06c2130a0acd033e35a23',
                            'format' : 'iframe',
                            'height' : 300,
                            'width' : 160,
                            'params' : {}
                        };
                    </script>
                    <script type="text/javascript" src="//www.highperformanceformat.com/33d68c3b8aa06c2130a0acd033e35a23/invoke.js"></script>
                </div>

                <!-- Smartlink Direct Button -->
                <div style="width: 100%; margin-top: 10px;">
                    <a href="https://www.profitablecpmratenework.com/cp4i5kd3?key=91a130ca73a97add1a71fb040b2afe5d" target="_blank" class="btn btn-primary" style="background: var(--gradient-success); color: white; text-decoration: none; display: flex; align-items: center; justify-content: center; padding: 14px; border-radius: 12px; font-weight: 600; box-shadow: 0 4px 15px rgba(5, 150, 105, 0.3);">
                        🎁 Click Here for Special Offer
                    </a>
                </div>

            </div>
        </div>

        <div class="bottom-spacer"></div>
    </div>

    <svg style="position: absolute; width: 0; height: 0;">
        <defs>
            <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#6c63ff;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:1" />
            </linearGradient>
        </defs>
    </svg>

    <script src="/js/dashboard.js"></script>

    <!-- Adsterra Social Bar -->
    <script type='text/javascript' src='//pl29123620.profitablecpmratenework.com/c9/67/8e/c9678e37f082ae2b8291460a535f065c.js'></script>
</body>

</html>
